<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panduan Betting Togel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas untuk fitur salin gambar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background-color: #0b0f19; color: #ffffff; font-family: 'Segoe UI', sans-serif; }
        /* Custom scrollbar untuk menu dropdown */
        #options-list::-webkit-scrollbar { width: 6px; }
        #options-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-10 px-4">

    <!-- Kontainer Utama (Area yang akan disalin) -->
    <div id="capture-area" class="w-full max-w-sm bg-[#0f172a] border border-blue-600/40 rounded-2xl p-5 shadow-2xl">
        
        <h1 class="text-lg font-bold text-center mb-5 text-blue-400 uppercase tracking-wider">Panduan Betting Togel</h1>

        <!-- Dropdown & Pencarian -->
        <div class="relative" id="dropdown-container">
            <button id="dropdown-btn" class="w-full bg-[#131e38] border border-blue-500/50 text-white text-sm py-3 px-4 rounded-xl flex items-center justify-between shadow-inner hover:border-blue-400 transition-colors">
                <span id="selected-value" class="truncate">- Cara Bet 4D 3D 2D</span>
                <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>

            <!-- Menu Dropdown -->
            <div id="dropdown-menu" class="absolute w-full mt-2 bg-[#101932] border border-blue-500/40 rounded-xl shadow-2xl z-50 hidden overflow-hidden">
                <!-- Input Pencarian -->
                <div class="p-2 border-b border-slate-700">
                    <input type="text" id="search-input" placeholder="Cari panduan..." class="w-full bg-[#0b0f19] border border-slate-600 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                </div>
                
                <!-- Daftar Opsi -->
                <div id="options-list" class="max-h-60 overflow-y-auto">
                    <!-- Opsi akan muncul di sini -->
                </div>
            </div>
        </div>

        <!-- Tombol Salin -->
        <div class="mt-6">
            <button id="copy-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2 text-sm">
                <span>📋</span> SALIN GAMBAR
            </button>
        </div>
    </div>

    <script>
        const optionsData = [
            "- Cara Bet 4D 3D 2D", "- Cara Bet Bb", "- Cara Bet Bbfs (Bb Campuran)", 
            "- Cara Bet Angka Tarung", "- Cara Bet Fast 4D", "- Cara Bet 4D, 3D, 2D Easy", 
            "- Cara Bet 3D", "- Cara Bet 2D Belakang", "- Cara Bet 2D Depan", 
            "- Cara Bet 2D Tengah", "- Cara Bet Colok Bebas", "- Cara Bet Colok Bebas 2D", 
            "- Cara Bet Colok Naga", "- Cara Bermain Colok Jitu", "- Cara Bermain Tengah Tepi", 
            "- Cara Bermain Togel Menu Bet [Dasar]", "- Cara Bermain Dan Bet Togel 50-50", 
            "- Cara Betting Shio", "- Cara Bermain Silang Homo", "- Cara Bermain Kembang Kempis", 
            "- Cara Bermain Kombinasi"
        ];

        const dropdownBtn = document.getElementById('dropdown-btn');
        const dropdownMenu = document.getElementById('dropdown-menu');
        const searchInput = document.getElementById('search-input');
        const optionsList = document.getElementById('options-list');
        const selectedValue = document.getElementById('selected-value');
        const copyBtn = document.getElementById('copy-btn');

        // Render Opsi
        function renderOptions(filter = "") {
            optionsList.innerHTML = "";
            optionsData.forEach(item => {
                if (item.toLowerCase().includes(filter.toLowerCase())) {
                    const div = document.createElement('div');
                    div.className = "option px-4 py-3 hover:bg-[#19284a] cursor-pointer text-sm border-b border-slate-800 transition-colors";
                    div.textContent = item;
                    div.onclick = () => {
                        selectedValue.textContent = item;
                        dropdownMenu.classList.add('hidden');
                        searchInput.value = "";
                        renderOptions();
                    };
                    optionsList.appendChild(div);
                }
            });
        }

        // Event Listeners
        dropdownBtn.addEventListener('click', () => dropdownMenu.classList.toggle('hidden'));
        searchInput.addEventListener('input', (e) => renderOptions(e.target.value));

        // Salin Gambar
        copyBtn.addEventListener('click', async () => {
            try {
                const canvas = await html2canvas(document.getElementById('capture-area'), {
                    backgroundColor: '#0f172a',
                    scale: 2,
                    useCORS: true
                });
                canvas.toBlob(async (blob) => {
                    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                    copyBtn.classList.replace('bg-blue-600', 'bg-green-600');
                    setTimeout(() => copyBtn.classList.replace('bg-green-600', 'bg-blue-600'), 2000);
                });
            } catch (err) { alert("Gagal menyalin."); }
        });

        // Initialize
        renderOptions();
    </script>
</body>
</html>
